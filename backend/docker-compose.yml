# ================================================================
# docker-compose.yml — EcoRewind Full Stack
# ================================================================
#
# PROFILS DISPONIBLES :
#   docker compose up -d                        → API seule (PostgreSQL local requis)
#   docker compose --profile standalone up -d  → API + PostgreSQL intégré
#   docker compose --profile ai up -d          → API + PostgreSQL + Worker IA
#   docker compose --profile full up -d        → Tout (API + PG + IA)
#
# COMMANDES UTILES :
#   docker compose logs -f api                 → Logs backend en temps réel
#   docker compose down                        → Arrêter les conteneurs
#   docker compose down -v                     → Arrêter + supprimer volumes
#   docker compose pull                        → Mettre à jour les images
#
# MIGRATIONS (après démarrage) :
#   docker compose exec api alembic upgrade head
# ================================================================

services:

  # ── PostgreSQL ───────────────────────────────────────────────
  postgres:
    profiles:
      - full
      - standalone
    image: postgres:16-alpine
    container_name: ecorewind_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ecorewind
      TZ: Africa/Tunis
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./backup_ecorewind.sql:/docker-entrypoint-initdb.d/01_backup.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ecorewind"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ─────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/chaymatl/cc-backend:latest
    container_name: ecorewind_api
    restart: unless-stopped
    env_file: .env
    environment:
      # Profil standalone : utilise le postgres du compose
      # Profil défaut     : utilise le postgres local via host.docker.internal
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgresql://postgres:postgres@host.docker.internal:5432/ecorewind}
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase_credentials.json
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro
    depends_on:
      postgres:
        condition: service_healthy
        required: false       # pas obligatoire en profil défaut (postgres absent)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      start_period: 25s
      retries: 3
    labels:
      org.opencontainers.image.title: "EcoRewind API"
      org.opencontainers.image.description: "FastAPI backend for EcoRewind waste management app"
      org.opencontainers.image.source: "https://github.com/chaymatl/cc"
      org.opencontainers.image.version: "1.0.0"

  # ── AI Worker (OPTIONNEL — profil ai / full) ─────────────────
  ai_worker:
    profiles:
      - ai
      - full
    build:
      context: .
      dockerfile: ai_worker/Dockerfile
    image: ghcr.io/chaymatl/cc-ai-worker:latest
    container_name: ecorewind_ai_worker
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/ecorewind
      GOOGLE_APPLICATION_CREDENTIALS: /app/firebase_credentials.json
      AI_WORKER_POLL_INTERVAL: 5
      AI_WORKER_BATCH_SIZE: 10
      AI_WORKER_LOG_LEVEL: INFO
      TRANSFORMERS_CACHE: /app/models
      HF_HOME: /app/models
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads
      - ./firebase_credentials.json:/app/firebase_credentials.json:ro
      - ai_models:/app/models
    deploy:
      resources:
        limits:
          memory: 6G
        reservations:
          memory: 2G

volumes:
  pgdata:
    driver: local
  ai_models:
    driver: local
