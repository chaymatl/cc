# Analysis options — EcoRewind
# Règles de linting renforcées pour PFE ingénieur senior.
# Référence : https://dart.dev/lints

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - build/**
  errors:
    # Traiter ces warnings comme des erreurs bloquantes
    invalid_annotation_target: ignore

linter:
  rules:
    # ── Qualité de code ──────────────────────────────────────────────
    avoid_print: true                    # Utiliser debugPrint ou developer.log
    always_declare_return_types: true    # Toujours typer les retours de fonctions
    prefer_final_locals: true           # Variables locales immuables par défaut
    avoid_dynamic_calls: true           # Pas d'appels sur `dynamic` non typé
    prefer_const_constructors: true     # Widgets immuables = meilleures perfs
    prefer_const_declarations: true     # Constantes déclarées const
    avoid_redundant_argument_values: false  # BUG analyseur Dart — crash interne
    unused_element: false                   # Faux positifs sur super.key dans widgets privés

    # ── Null safety & robustesse ─────────────────────────────────────
    avoid_null_checks_in_equality_operators: true
    prefer_null_aware_operators: true
    use_if_null_to_convert_nulls_to_bools: false

    # ── Lisibilité ───────────────────────────────────────────────────
    prefer_single_quotes: true           # Cohérence des guillemets
    sort_child_properties_last: true     # child: toujours en dernier dans Flutter
    sized_box_for_whitespace: true       # SizedBox plutôt que Container vide
    use_super_parameters: true          # super.key au lieu de Key? key
    prefer_relative_imports: true       # Imports relatifs dans le même package

    # ── Performance Flutter ──────────────────────────────────────────
    avoid_unnecessary_containers: true  # Pas de Container() inutile
    use_full_hex_values_for_flutter_colors: true
    prefer_const_literals_to_create_immutables: true
